<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dorm Tour</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #panorama {
      width: 100%;
      height: 100vh;
    }
    .dorm-switcher {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: min(760px, calc(100vw - 20px));
    }
    .dorm-switcher button {
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="dorm-switcher">
    <button type="button" data-scene="zapOne">ZAP</button>
    <button type="button" data-scene="okadaOne">Okada</button>
    <button type="button" data-scene="rinconadaOne">Rinconada</button>
    <button type="button" data-scene="sotoOne">Soto</button>
    <button type="button" data-scene="sallyRideOne">Sally Ride</button>

    document.querySelectorAll("[data-scene]").forEach((button) => {

</body>
</html>
