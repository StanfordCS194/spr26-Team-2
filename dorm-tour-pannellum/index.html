<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dorm Tour</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    #panorama {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>

  <script>
    const HOTSPOT_DEBUG = false;
    const PANORAMA_BASE = "otherPhotos/";

    function pano(file) {
      return PANORAMA_BASE + file;
    }

    const baseScene = {
      type: "equirectangular",
      autoLoad: true,
      hfov: 70,
      minHfov: 50,
      maxHfov: 90,
      haov: 110,
      vaov: 45,
      vOffset: 0,
      yaw: 0,
      pitch: 0,
      minYaw: -55,
      maxYaw: 55,
      minPitch: -22,
      maxPitch: 22,
      avoidShowingBackground: true
    };

    pannellum.viewer("panorama", {
      default: {
        firstScene: "zapOne",
        autoLoad: true,
        sceneFadeDuration: 800,
        showControls: true,
        showFullscreenCtrl: true,
        hotSpotDebug: HOTSPOT_DEBUG
      },
      scenes: {
        zapOne: {
          ...baseScene,
          title: "ZAP One",
          panorama: pano("ZAP_One.jpeg"),
          hotSpots: [
            {
              pitch: 3.5,
              yaw: -18,
              type: "scene",
              text: "Go to ZAP Two",
              sceneId: "zapTwo",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            }
          ]
        },
        zapTwo: {
          ...baseScene,
          title: "ZAP Two",
          panorama: pano("ZAP_Two.jpeg"),
          hotSpots: [
            {
              pitch: 2,
              yaw: 45,
              type: "scene",
              text: "Back to ZAP One",
              sceneId: "zapOne",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            },
            {
              pitch: 3,
              yaw: -42,
              type: "scene",
              text: "Go to ZAP Three",
              sceneId: "zapThree",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            }
          ]
        },
        zapThree: {
          ...baseScene,
          title: "ZAP Three",
          panorama: pano("ZAP_Three.jpeg"),
          hotSpots: [
            {
              pitch: 2,
              yaw: 45,
              type: "scene",
              text: "Back to ZAP Two",
              sceneId: "zapTwo",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            },
            {
              pitch: 2,
              yaw: 24,
              type: "scene",
              text: "Go to ZAP Four",
              sceneId: "zapFour",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            }
          ]
        },
        zapFour: {
          ...baseScene,
          title: "ZAP Four",
          panorama: pano("ZAP_Four.jpeg"),
          hotSpots: [
            {
              pitch: 3,
              yaw: -31,
              type: "scene",
              text: "Back to ZAP Three",
              sceneId: "zapThree",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            },
            {
              pitch: 3,
              yaw: 4,
              type: "scene",
              text: "Go to ZAP Five",
              sceneId: "zapFive",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            }
          ]
        },
        zapFive: {
          ...baseScene,
          title: "ZAP Five",
          panorama: pano("ZAP_Five.jpeg"),
          hotSpots: [
            {
              pitch: 3,
              yaw: 50,
              type: "scene",
              text: "Back to ZAP Four",
              sceneId: "zapFour",
              targetYaw: 0,
              targetPitch: 0,
              targetHfov: 70
            }
          ]
        }
      }
    });
  </script>
</body>
</html>
